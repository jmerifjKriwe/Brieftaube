[project]
name = "brieftaube"
version = "0.1.0"
description = "Brieftaube — a self-hosted notification hub that routes messages to people through user-defined channels (Signal, MQTT, and more)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "jmerifjKriwe" }]
requires-python = ">=3.13"
dependencies = [
    "aiomqtt>=2.3",
    "alembic>=1.14",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "itsdangerous>=2.2",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.18",
    "sqlalchemy[asyncio]>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[project.urls]
Repository = "https://github.com/jmerifjKriwe/Brieftaube"
Issues = "https://github.com/jmerifjKriwe/Brieftaube/issues"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-playwright>=0.6",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brieftaube"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e' --strict-markers --strict-config -q"
markers = [
    "e2e: end-to-end browser tests (Playwright). Excluded by default; run with `just test-e2e`.",
]
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# ruff — lint AND format. Keep in sync with .pre-commit-config.yaml.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "A",     # flake8-builtins
    "ANN",   # flake8-annotations — code is fully typed, pyright verifies
    "ASYNC", # flake8-async — matters for an asyncio app
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "DTZ",   # flake8-datetimez — no naive datetimes
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "PTH",   # flake8-use-pathlib — use pathlib, not os.path
    "RUF",   # ruff-specific rules
    "S",     # flake8-bandit (security)
    "SIM",   # flake8-simplify
    "T20",   # flake8-print — no print(), use logging
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # asserts are the point of tests
    "ANN",  # type annotations optional where obvious in tests
]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# pyright
# ---------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/brieftaube"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
